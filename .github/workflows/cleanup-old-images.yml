---
name: Clean up old images
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "05 7 * * *" # 7:05 UTC everyday
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-old-images.yml"
  pull_request: # dry run only, when this workflow changes
    paths:
      - ".github/workflows/cleanup-old-images.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup-homeserver-images:
    name: Cleanup Homeserver Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cleanup-images
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 90 Days
        if: false
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          older-than: 90 days
          #delete-orphaned-images: true
          #delete-untagged: true
          owner: ${{ github.repository_owner }}
          #repository: ${{ github.event.repository.name }}
          packages: homeserver-centos-bootc/**/*,homeserver-centos-bootc/*,homeserver-*,homeserver-**
          expand-packages: true
          keep-n-tagged: 7
          #keep-n-untagged: 7
          # dry-run: true

      - name: Delete Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          delete-untagged: true
          packages: homeserver-bootc/homeserver-centos-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc

      - name: Delete old PR Images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          delete-tags: pr-*
          log-level: debug
          older-than: 7 days
          packages: homeserver-bootc/homeserver-centos-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc

      - name: Delete ghost images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          delete-ghost-images: true
          packages: homeserver-bootc/homeserver-centos-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc

      - name: Clean up old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          keep-n-tagged: 10
          exclude-tags: latest
          older-than: 14 days
          packages: homeserver-bootc/homeserver-centos-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc
