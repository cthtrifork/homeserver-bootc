---
name: Clean up old images
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "05 7 * * *" # 7:05 UTC everyday
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-old-images.yml"
  pull_request: # runs for real when this workflow changes
    paths:
      - ".github/workflows/cleanup-old-images.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup-homeserver-images:
    name: Cleanup Homeserver Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cleanup-images
    permissions:
      packages: write
    env:
      # Packages built by this repo (see .github/actions/set-image-vars)
      PACKAGES: homeserver-bootc/homeserver-centos-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc
    steps:
      - name: Delete Images Older Than 90 Days
        if: false
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          older-than: 90 days
          #delete-orphaned-images: true
          #delete-untagged: true
          packages: ${{ env.PACKAGES }}
          exclude-tags: main-*,latest
          keep-n-tagged: 7
          #keep-n-untagged: 7
          # dry-run: true

      - name: Delete Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          delete-untagged: true
          packages: ${{ env.PACKAGES }}

      - name: Delete old PR Images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          # Not delete-tags: for multi-tag images (pr-*, sha-*) the action unlinks
          # tags one by one, which GHCR rejects with HTTP 400. keep-n-tagged: 0
          # deletes whole images; exclude-tags protects main and latest images.
          keep-n-tagged: 0
          exclude-tags: main-*,latest
          older-than: 7 days
          packages: ${{ env.PACKAGES }}

      - name: Delete ghost images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          delete-ghost-images: true
          exclude-tags: main-*,latest
          packages: ${{ env.PACKAGES }}

      - name: Clean up old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          # Prune old main images: everything younger than 30 days is kept, plus the
          # 5 newest older ones. No delete-tags, so whole images are deleted. latest is
          # never deleted.
          keep-n-tagged: 5
          exclude-tags: latest
          older-than: 30 days
          packages: ${{ env.PACKAGES }}
