name: Push hello image

on:
  push:
    branches: [ main ]
    paths:
      - "utils/hello.containerfile"
      - ".github/workflows/push-hello-containerfile.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "utils/hello.containerfile"
      - ".github/workflows/push-hello-containerfile.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a publish on main, only superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Push Hello Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/hello
          tags: |
            # set latest tag for default branch
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push-latest
        with:
          context: .
          file: ./utils/hello.containerfile
          push: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      - name: Run image
        if: ${{ github.ref != 'refs/heads/main' }}
        run: docker run --rm ${{ steps.meta.outputs.tags }}

      - name: Install Cosign
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign container image
        if: ${{ github.ref == 'refs/heads/main' }}
        run: | #sh
          # build-push-action pushes an index (image + provenance); containers/image also
          # checks the platform manifest it pulls, so sign the children too
          cosign sign -y --recursive --use-signing-config=false --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY ghcr.io/${{ github.repository }}/hello@${{ env.DIGEST }} # --registry-username='${{ github.actor }}' --registry-token='${{ secrets.GITHUB_TOKEN }}'
        env:
          DIGEST: ${{ steps.push-latest.outputs.digest }}
          COSIGN_EXPERIMENTAL: true
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""

      - name: Attach build provenance attestation
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: "ghcr.io/${{ github.repository }}/hello"
          subject-digest: ${{ steps.push-latest.outputs.digest }}
          push-to-registry: true
