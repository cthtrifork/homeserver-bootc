name: E2E

# Starts the QEMU e2e test (e2e-test.yaml) when the `e2e` label is added to a PR whose images are already built.
# Nothing here waits: a push (or a PR that already has the label) is tested by the e2e job at the end of each
# image's own pipeline in build-bootc-image.yaml, which also covers a label added while that image is still
# building. This workflow only picks up the images that finished building before the label was added.
on:
  pull_request:
    types: [labeled]
    branches:
      - main

# least privilege by default, jobs elevate individually
permissions:
  contents: read

jobs:
  select:
    name: Select images to test
    # Fork PRs get no secrets. Other labels (Renovate adds several) and drafts start nothing; a draft is built and
    # tested once it is marked ready for review.
    if: ${{ github.event.label.name == 'e2e' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read # list the build run and its jobs
      contents: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BUILD_WORKFLOW: build-bootc-images.yaml
    steps:
      - name: List the images already built for this commit
        id: select
        run: | #sh
          set -euo pipefail

          # newest build run of this commit. Cancelled runs (superseded duplicates) and skipped runs (a `labeled`
          # event for a label the build ignores, such as e2e itself, skips the whole run) built nothing and do not count.
          run_id=$(gh api "repos/$REPO/actions/workflows/$BUILD_WORKFLOW/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=30" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")] | sort_by(.created_at) | last | .id // empty')

          images='[]'
          if [ -n "$run_id" ]; then
            # jobs are named "<image> / Build image <image>"; only images whose build succeeded are tested here.
            # An image that is still building tests itself when its build finishes.
            images=$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion == "success") | .name' \
              | sed -n 's# / Build image .*##p' | jq -R . | jq -sc .)
          else
            echo "No build run for $HEAD_SHA: the build tests the images itself once it runs"
          fi
          echo "Images already built: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  e2e:
    name: ${{ matrix.image }}
    needs: select
    if: ${{ needs.select.outputs.images != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    uses: ./.github/workflows/e2e-test.yaml
    with:
      image: ${{ matrix.image }}
    secrets: inherit
    # the called job can only narrow these
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
