name: Build homeserver bootable container image
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00: patch every image whose base is newer or that is ~2 weeks old (see "Detect changed areas")
  workflow_dispatch:
    inputs:
      force:
        description: "Force build all images"
        required: false
        default: false
        type: boolean
      override_image:
        description: "Image to build (overrides change detection)"
        default: ""
        type: choice
        required: false
        options:
          - homeserver
          - homeserver-gui
          - claude-vm
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event.inputs.override_image }}
  # never cancel release/scheduled builds on main, only superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# least privilege by default, jobs elevate individually
permissions:
  contents: read


jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
      packages: read # to read the build date of the published images (scheduled runs)
    outputs:
      image: ${{ steps.ensure-matrix.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ github.token }}
          predicate-quantifier: some-with-excludes
          filters: |
            homeserver:
              - 'system_files/homeserver/**'
              - 'homeserver.containerfile'
              - '**/homeserver/**'
              - 'build_files/**'
              - '!build_files/gui/**'
              - '!build_files/claude-vm/**'
              # shared build inputs: they have always rebuilt the default image only
              - 'config.toml'
              - 'tests/*.sh'
              - '.github/workflows/build-bootc-image*.yaml'
              - '!**/*.md' # docs never change an image
            homeserver-gui:
              - 'system_files/homeserver-gui/**'
              - 'homeserver-gui.containerfile'
              - '**/homeserver-gui/**'
              - '!**/*.md' # docs never change an image
            claude-vm:
              - 'system_files/claude-vm/**'
              - 'claude-vm.containerfile'
              - '**/claude-vm/**'
              # the VM reuses the homeserver SSH public keys
              - 'system_files/homeserver/usr/share/homeserver/authorized_keys.pub'
              - 'build_files/gui/**'
              - '!**/*.md' # docs never change an image

      - name: Pick images to build
        id: ensure-matrix
        env:
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
          OVERRIDE_IMAGE: ${{ github.event.inputs.override_image }}
          FORCE: ${{ github.event.inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          BASE_IMAGE: quay.io/fedora/fedora-bootc:44 # keep in step with the FROM line of the containerfiles
          MAX_AGE_DAYS: "13" # a published image older than this is rebuilt even if the base is unchanged
        run: | #sh
          set -x
          IMAGES="$FILTER_CHANGES"

          # The weekly run is for patching, so it covers every image instead of only the changed paths.
          # An image is skipped when it is both newer than the base image (so it already carries its updates) and younger than MAX_AGE_DAYS (so it has the distro's
          # recent package updates). If the dates cannot be read, the image is rebuilt.
          if [ "$EVENT_NAME" == "schedule" ]; then
            created() { # <ref> [creds]: build date as epoch seconds, empty when unknown
              local t
              t=$(skopeo inspect ${2:+--creds "$2"} "docker://$1" 2>/dev/null \
                | jq -r '.Labels["org.opencontainers.image.created"] // .Created // empty') || return 0
              [ -n "$t" ] && date -d "$t" +%s 2>/dev/null || true
            }
            base_ts=$(created "$BASE_IMAGE")
            now=$(date +%s)
            IMAGES='[]'
            for img in homeserver:homeserver-centos-bootc homeserver-gui:homeserver-gui-bootc claude-vm:claude-vm-bootc; do
              ts=$(created "$IMAGE_PREFIX/${img#*:}:latest" "$REGISTRY_USER:$REGISTRY_TOKEN")
              if [ -n "$ts" ] && [ -n "$base_ts" ] && [ "$ts" -ge "$base_ts" ] \
                && [ $(( (now - ts) / 86400 )) -lt "$MAX_AGE_DAYS" ]; then
                echo "Skipping ${img%%:*}: newer than $BASE_IMAGE and under $MAX_AGE_DAYS days old"
              else
                IMAGES=$(jq -c --arg i "${img%%:*}" '. + [$i]' <<< "$IMAGES")
              fi
            done
            echo "Scheduled rebuild of: $IMAGES"
          fi
          if [ -n "$OVERRIDE_IMAGE" ]; then
            IMAGES=$(jq -cn --arg i "$OVERRIDE_IMAGE" '[$i]')
          fi
          if [ "$FORCE" == "true" ]; then
            IMAGES='["homeserver","homeserver-gui","claude-vm"]'
          fi
          # A manual run without inputs builds the default image. Elsewhere an empty list means
          # nothing relevant changed (or, on a scheduled run, everything is up to date): build nothing.
          if [ "$IMAGES" == "[]" ] && [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            IMAGES='["homeserver"]'
          fi
          echo "image=$IMAGES" >> "$GITHUB_OUTPUT"

  # One independent pipeline per image (build-bootc-image.yaml): the images do not wait for each other.
  image:
    name: ${{ matrix.image }}
    needs: changes
    # an empty list (a scheduled run with everything up to date) is not a valid matrix
    if: ${{ needs.changes.outputs.image != '[]' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false)) }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.image) }}
    uses: ./.github/workflows/build-bootc-image.yaml
    with:
      image: ${{ matrix.image }}
    secrets: inherit
    # the called jobs can only narrow these
    permissions:
      contents: write # for releases
      packages: write
      id-token: write
      security-events: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
      actions: write # to prune old runner caches
