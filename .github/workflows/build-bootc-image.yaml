name: Build and publish bootc image

# Called once per image by build-bootc-images.yaml. Every image runs this whole pipeline on its own
# (build, then scan/test on a PR or push and sign on main), so a slow image never holds back another
# one's publish step.
on:
  workflow_call:
    inputs:
      image:
        description: "Image to build (homeserver|homeserver-gui|claude-vm)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_DESC: "${{ github.event.repository.description }}"
  REPO_NAME: "${{ github.event.repository.name }}" # output image name, usually same as repo name
  DEFAULT_TAG: "latest"
  CONTEXT: ./
  TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy
  CRANE_VERSION: v0.22.1 # renovate: datasource=github-releases packageName=google/go-containerregistry

jobs:
  build-bootc-image:
    name: Build image ${{ inputs.image }}
    runs-on: ${{ inputs.image == 'homeserver-gui' && 'arc-ubuntu' || 'ubuntu-latest' }}
    #runs-on: arc-ubuntu
    #runs-on: ubuntu-latest
    continue-on-error: false
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    timeout-minutes: 90
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      tags: ${{ steps.build-image.outputs.tags }}
      digest: ${{ steps.push-to-ghcr.outputs.digest }}
    permissions:
      contents: write # for releases
      packages: write
      id-token: write
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      attestations: write
      pull-requests: write # for PR comments
      actions: write # to prune old runner caches

    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 300 # Checkout last 300 commits (for the changelog commit list)

      - name: Install crane
        uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987 # v0.5
        with:
          version: ${{ env.CRANE_VERSION }}

      - name: Set image vars
        uses: ./.github/actions/set-image-vars
        with:
          image: ${{ inputs.image }}
          allocate_version: "true"

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like
          # 2022-02-08T15:38:15Z
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_RENOVATEBOT }}
          #password: ${{ github.token }}
          auth_file_path: ${{ runner.temp }}/auth.json

      - name: Make registry credentials available for sudo
        shell: bash
        run: |
          sudo mkdir -p /root/.config/containers
          sudo cp ${{ runner.temp }}/auth.json /root/.config/containers/auth.json
          sudo chmod 644 /root/.config/containers/auth.json

      - name: Mount BTRFS for podman storage
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main
        with:
          target-dir: /var/lib/containers

      - name: Prepare Podman
        uses: ./.github/actions/prepare-podman
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_as_sudo: "true"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DOCKER_TAG }},enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=${{ env.UNIQUE_VERSION }},enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'pull_request' }},format=long
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/blob/main/${{ env.CONTAINERFILE }}
            org.opencontainers.image.title=${{ env.REPO_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Prepare build secrets
        shell: bash
        env:
          PINGGY_TOKEN_SECRET: ${{ secrets.PINGGY_TOKEN }}
          HOMESERVER_PAT_SECRET: ${{ secrets.HOMESERVER_PAT }}
          AGE_KEY_SECRET: ${{ secrets.AGE_KEY }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "" > /tmp/PINGGY_TOKEN
          else
            printf "%s\n" "${PINGGY_TOKEN_SECRET}" > /tmp/PINGGY_TOKEN
          fi

          printf "%s\n" "${HOMESERVER_PAT_SECRET}" > /tmp/REGISTRY_TOKEN
          cp "${HOME}/.docker/config.json" /tmp/creds
          printf "%s\n" "${AGE_KEY_SECRET}" > /tmp/AGE_KEY
          chmod 600 /tmp/creds
          chmod 600 /tmp/REGISTRY_TOKEN
          chmod 600 /tmp/PINGGY_TOKEN
          chmod 600 /tmp/AGE_KEY

      # All images use /runner/cache for downloaded release binaries; hosted runners only (self-hosted keep
      # the directory); only main saves, so PR runs do not fill the 10 GB repo cache quota.
      - name: Runner cache config
        id: cache-cfg
        env:
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
        run: |
          enabled=false; save=false
          if [[ "${SELF_HOSTED}" != "true" ]]; then
            enabled=true
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] && save=true
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          echo "save=${save}" >> "$GITHUB_OUTPUT"

      # Rolling cache: restore the newest entry for this image (the key is unique per run, so it is
      # always a prefix match and cache-hit is never 'true'); the save happens at the end of the job.
      - name: Restore runner cache
        id: runner-cache
        if: ${{ steps.cache-cfg.outputs.enabled == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/.cache/tmp
          key: cache-runners-${{ inputs.image }}-${{ github.run_id }}
          restore-keys: |
            cache-runners-${{ inputs.image }}-

      - name: Remove old runner cache
        #if: steps.runner-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p /home/runner/.cache/tmp
          echo "Deleting old files:"
          # earlier builds ran as root, so the files may be root-owned
          sudo find /home/runner/.cache/tmp -type f -mtime +14 -print -delete
          sudo find /home/runner/.cache/tmp -mindepth 1 -type d -empty -mtime +14 -print -delete

      - name: Fingerprint runner cache
        id: cache-before
        if: ${{ steps.cache-cfg.outputs.save == 'true' }}
        run: echo "sum=$(find /home/runner/.cache/tmp -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A killed or evicted pod skips the end-of-job cleanup and leaves working containers
      # on the persistent runner volumes, so drop them before building.
      - name: Remove leftovers of earlier builds
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          sudo buildah rm --all || true

      - name: Check free disk space
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          # A full node volume otherwise surfaces as an opaque dnf "needs N MB more space" (exit 123) mid-build
          df -h /var/lib/containers/storage /home/runner/.cache/tmp
          avail_gb=$(df --output=avail -BG /var/lib/containers/storage | tail -1 | tr -dc '0-9')
          if (( avail_gb < 20 )); then
            echo "::error::Only ${avail_gb}G free on the runner's container storage (need 20G); free space on the node's local-path volume (zot retention, PVCs)"
            exit 1
          fi

      - name: Buildah build
        id: build-image
        shell: bash
        env:
          LABELS: ${{ steps.metadata.outputs.labels }}
          DOCKER_BUILDKIT: "1"
        run: |
          # Build a labels array from the multi-line env var
          labels=()
          while IFS= read -r line; do
            labels+=( --label "$line" )
          done <<< "${{ env.DOCKER_METADATA_OUTPUT_LABELS }}"

          sudo /usr/bin/buildah bud -f ${{ env.CONTAINERFILE }} \
            "${labels[@]}" \
            --build-arg REGISTRY_USERNAME="${{ github.repository_owner }}" \
            --build-arg REGISTRY_URL=ghcr.io \
            --build-arg PINGGY_HOST=${{ vars.PINGGY_HOST }} \
            --build-arg REPOSITORY="${{ github.repository_owner }}/${{ github.event.repository.name }}" \
            --build-arg "HTTP_PROXY=${HTTP_PROXY}" \
            --build-arg "HTTPS_PROXY=${HTTPS_PROXY}" \
            --build-arg "NO_PROXY=${NO_PROXY}" \
            --format docker \
            --tls-verify=true \
            --layers=false \
            --secret id=registry_token,src=/tmp/REGISTRY_TOKEN \
            --secret id=pinggy_token,src=/tmp/PINGGY_TOKEN \
            --secret id=creds,src=/tmp/creds \
            --secret id=agekey,src=/tmp/AGE_KEY \
            -v /home/runner/.cache/dnf:/var/cache/libdnf5:z \
            -v /home/runner/.cache/tmp:/runner/cache:z \
            -t ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }} \
            ${{ env.CONTEXT }}

      - name: Extract previous manifest
        run: |
          # The previous revision label is read from this to build the changelog
          skopeo inspect "docker://${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}" --authfile ${{ runner.temp }}/auth.json > previous.manifest.json \
            || { echo "No previous manifest (first build of this image?)"; echo '{}' > previous.manifest.json; }

      # SOURCE_DATE_EPOCH clamps file mtimes so unchanged packages give identical layer digests across builds,
      # which is what lets the push skip layers the registry already has.
      # chunkah splits the flat rootfs of the built image into content-based (per RPM) layers. The image is
      # mounted straight from root's containers-storage, so nothing is copied or tarred. OSTree data is pruned
      # because the image is a plain layered bootc image, and the labels of the build (podman inspect) are kept
      # except the ostree ones the base image carries.
      - name: Rechunk with chunkah
        id: rechunk
        env:
          CHUNKAH_IMAGE: quay.io/coreos/chunkah:v0.7.1
          CREATED: ${{ steps.date.outputs.date }}
          MAX_LAYERS: "128"
        run: |
          out="${RUNNER_TEMP}/chunked"
          rm -rf "${out}"; mkdir -p "${out}"
          CHUNKAH_CONFIG_STR="$(sudo podman inspect "localhost/${IMAGE_NAME}:${DOCKER_TAG}")"
          export CHUNKAH_CONFIG_STR
          # Package overview for the changelog: name and version of every RPM, stored gzip+base64 as an image
          # label so the next build can diff against it (see group-changelog.py).
          sudo podman run --rm "localhost/${IMAGE_NAME}:${DOCKER_TAG}" \
            rpm -qa --qf '%{NAME}\t%{EVR}\n' | LC_ALL=C sort > "${RUNNER_TEMP}/packages.tsv"
          wc -l "${RUNNER_TEMP}/packages.tsv"
          pkg_label="$(gzip -9n < "${RUNNER_TEMP}/packages.tsv" | base64 -w0)"
          sudo --preserve-env=CHUNKAH_CONFIG_STR podman run --rm \
            --security-opt label=disable \
            --mount "type=image,src=localhost/${IMAGE_NAME}:${DOCKER_TAG},target=/chunkah" \
            -v "${out}:/out" \
            -e CHUNKAH_CONFIG_STR \
            -e SOURCE_DATE_EPOCH=1 \
            "${CHUNKAH_IMAGE}" build \
              --prune /sysroot/ \
              --max-layers "${MAX_LAYERS}" \
              --label ostree.commit- --label ostree.final-diffid- \
              --label "org.homeserver.rpm-packages=${pkg_label}" \
              --compressed --compression-level 3 \
              --output oci:/out/img
          sudo chown -R "$(id -u):$(id -g)" "${out}"
          # SOURCE_DATE_EPOCH=1 leaves the image created time at 1970; set the real build time (layers untouched)
          python3 -I .github/scripts/set-image-created.py "${out}/img" "${CREATED}"
          echo "ref=oci:${out}/img" >> "${GITHUB_OUTPUT}"
          printf '# %s\n## Version: %s\n\n## Changes since last version:\n### Commits\n\n<!--COMMITS-->\n\n### Package Changes\n\n<!--PACKAGES-->\n' \
            "${IMAGE_NAME}" "${UNIQUE_VERSION}" > "${RUNNER_TEMP}/changelog.md"
          echo "changelog=${RUNNER_TEMP}/changelog.md" >> "${GITHUB_OUTPUT}"

      # Fill the commit list of the changelog.
      - name: Group changelog commits
        env:
          CHANGELOG: ${{ steps.rechunk.outputs.changelog }}
          IMAGE: ${{ inputs.image }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PACKAGES: ${{ runner.temp }}/packages.tsv
        run: |
          python3 -I .github/scripts/group-changelog.py "${CHANGELOG}"

      - name: Changelog PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: ${{ steps.rechunk.outputs.changelog }}
          skip_unchanged: true
          header: "🧾 Changelog for ${{ env.IMAGE_FULL }}"

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: comnoco/create-release-action@7dea6dc82ac9d97ced7a764aa82811451bba80e0 # v2.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{env.IMAGE_NAME}}_${{ env.UNIQUE_VERSION }}
          release_name: Release ${{env.IMAGE_NAME}} - ${{ env.UNIQUE_VERSION }}
          body_path: ${{ steps.rechunk.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Push ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
        id: push-to-ghcr
        uses: ./.github/actions/push-image
        with:
          source_ref: ${{ steps.rechunk.outputs.ref }}
          additional_tags: ${{ steps.metadata.outputs.tags }}
          auth_file_path: ${{ runner.temp }}/auth.json

      # Only main saves, so PR runs do not fill the 10 GB repo cache quota. always() so a failed
      # build still keeps what it downloaded. The build runs as root via sudo, so hand the files
      # back to the runner user for the cache tar.
      # The build runs as root via sudo; hand the files back to the runner user for the cache tar,
      # then flag whether the file list changed so an identical ~800 MB cache is not uploaded again.
      - name: Check runner cache changes
        id: cache-after
        if: ${{ always() && steps.cache-cfg.outputs.save == 'true' }}
        env:
          BEFORE: ${{ steps.cache-before.outputs.sum }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" /home/runner/.cache/tmp || true
          after=$(find /home/runner/.cache/tmp -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)
          echo "changed=$([[ "${after}" != "${BEFORE}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save runner cache
        if: ${{ always() && steps.cache-after.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/.cache/tmp
          key: cache-runners-${{ inputs.image }}-${{ github.run_id }}

      - name: Prune old runner caches
        if: ${{ always() && steps.cache-after.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: | #sh
          # keep only the newest entry for this image (the one just saved)
          gh cache list --key "cache-runners-${{ inputs.image }}-" --ref refs/heads/main \
            --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete || true

      - name: Build cleanup
        if: always()
        uses: ./.github/actions/build-cleanup

  run-on-pr:
    name: "Run on PR: ${{ inputs.image }}"
    runs-on: ${{ inputs.image == 'homeserver-gui' && 'arc-ubuntu' || 'ubuntu-latest' }}
    #runs-on: 'arc-ubuntu'
    needs:
      - build-bootc-image
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: false
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write

    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image vars
        uses: ./.github/actions/set-image-vars
        with:
          image: ${{ inputs.image }}

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          #auth_file_path: ${{ runner.temp }}/auth.json

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like
          # 2022-02-08T15:38:15Z
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Prepare Podman
        uses: ./.github/actions/prepare-podman
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure trivy is installed and DB is cached
        uses: ./.github/actions/setup-trivy
        with:
          trivy_version: ${{ env.TRIVY_VERSION }}

      # A new image has no published :latest yet, so there is nothing to diff against until its first release.
      - name: Check for a published baseline (:latest)
        id: baseline
        env:
          IMAGE_FULL: ${{ env.IMAGE_FULL }}
        run: | #sh
          if skopeo inspect --raw "docker://${IMAGE_FULL}:latest" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ${IMAGE_FULL}:latest yet, skipping the baseline comparison"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
        uses: ./.github/actions/load-image
        with:
          pull_latest: ${{ steps.baseline.outputs.exists }}

      # The table report is rendered from the PR scan's JSON (trivy convert) instead of scanning the image twice.
      # Scans run one after the other: they share trivy's cache directory, which only one process can lock.
      - name: Trivy vuln scan (JSON) - current
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: | #sh
          # timeout: the default 5m is too short for the large GUI image on a cold runner
          trivy image --scanners vuln --ignore-unfixed --timeout 15m --format json \
            --output "$GITHUB_WORKSPACE/current_trivy.json" "$LOCAL_PR_IMAGE"

      - name: Trivy vuln scan (JSON) - latest
        if: ${{ steps.baseline.outputs.exists == 'true' }}
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: | #sh
          trivy image --scanners vuln --ignore-unfixed --timeout 15m --format json \
            --output "$GITHUB_WORKSPACE/latest_trivy.json" "${IMAGE_FULL}:latest"

      - name: Trivy REPORT table - current
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: | #sh
          trivy convert --format table --severity CRITICAL,HIGH,MEDIUM \
            --output "trivy-${{ inputs.image }}-report.txt" current_trivy.json

      # not zipped (archive: false), so the report opens straight in the browser from the link
      - name: Upload Trivy report as an artifact
        id: trivy-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: trivy-${{ inputs.image }}-report.txt
          archive: false
          retention-days: 20

      - name: Write Trivy comment
        env:
          ARTIFACT_URL: ${{ steps.trivy-artifact.outputs.artifact-url }}
        run: | #sh
          {
            echo "### 🛡️ Trivy summary for ${{ inputs.image }}"
            echo ""
            echo "[Full Trivy report](${ARTIFACT_URL})"
          } > trivy-comment.md

      - name: Sticky PR comment (Trivy summary)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: trivy-comment.md
          header: "🛡️ Trivy summary for ${{ inputs.image }}"

      - name: Generate a report for the PR
        if: ${{ steps.baseline.outputs.exists == 'true' }}
        uses: ./.github/actions/pr-report

      - name: Build cleanup
        if: always()
        uses: ./.github/actions/build-cleanup

  test:
    name: "E2E Test on: ${{ inputs.image }}"
    # homeserver-gui has its own runner due to disksize requirements
    # pinned to 24.04: bootc-image-builder used to fail mounting containers-storage on ubuntu-latest (not re-checked with bootc install)
    runs-on: ${{ inputs.image == 'homeserver-gui' && 'arc-ubuntu' || 'ubuntu-24.04' }}
    needs:
      - build-bootc-image
    # only run if tagged for testing
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'e2e') }}
    continue-on-error: false
    # bootc install of a chunkah image hashes and relabels every file on the client (rechunk shipped a ready ostree
    # commit), so it takes minutes on homeserver and longer on the large GUI image
    timeout-minutes: ${{ inputs.image == 'homeserver-gui' && 45 || 30 }}
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    env:
      SSH_USERNAME: root
      SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5"

    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image vars
        uses: ./.github/actions/set-image-vars
        with:
          image: ${{ inputs.image }}

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Podman
        uses: ./.github/actions/prepare-podman
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          minimal: "true"

      - name: Load ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
        uses: ./.github/actions/load-image
        with:
          run_as_sudo: true
          pull_latest: "false"

      - name: Generate ephemeral SSH keypair
        id: ssh-key
        run: | #sh
          set -e
          mkdir -p out
          ssh-keygen -t ed25519 -N "" -f out/ci_ssh_key
          echo "PUBKEY=$(cat out/ci_ssh_key.pub)" >> $GITHUB_ENV

          echo "ssh_key=./out/ci_ssh_key" >> $GITHUB_OUTPUT

      - name: Write authorized_keys for root SSH access
        run: | #sh
          set -e
          echo "${PUBKEY}" > out/authorized_keys

      - name: Create bootable image
        id: create-vmdk
        uses: ./.github/actions/bootc-install-disk
        with:
          authorized_keys_file: out/authorized_keys

      - name: Boot QEMU (headless) with SSH forward
        env:
          DISK: ${{ steps.create-vmdk.outputs.path }}
        run: | #sh
          set -e
          sudo qemu-system-x86_64 \
            -name bootc-vm \
            -enable-kvm \
            -cpu host \
            -smp "$(nproc)" \
            -m 4G \
            -drive if=virtio,file="${DISK}",format=raw \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::2222-:22 \
            -display none \
            -monitor unix:/tmp/qemu-monitor-sock,server,nowait \
            -daemonize > out/qemu-console.log 2>&1

      - name: Load private key
        id: private_key_path
        env:
          SSH_PRIVATEKEY_B64: ${{ secrets.SSH_PRIVATEKEY_B64 }}
        shell: bash
        run: |
          echo "${SSH_PRIVATEKEY_B64}" | base64 -d > /tmp/ssh_privatekey
          chmod 600 /tmp/ssh_privatekey

          echo "Public key derived from secret:"
          ssh-keygen -y -f /tmp/ssh_privatekey

          echo "private_key_path=/tmp/ssh_privatekey" >> $GITHUB_OUTPUT

      - name: Test (QEMU)
        uses: ./.github/actions/qemu-test
        with:
          SSH_KEY: ${{ steps.ssh-key.outputs.ssh_key}}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_OPTIONS: ${{ env.SSH_OPTIONS }}
          SSH_PRIVATE_KEY: ${{ steps.private_key_path.outputs.private_key_path }}
          IMAGE: ${{ inputs.image }}

      - name: Take QEMU screenshot
        if: ${{ endsWith(inputs.image, 'gui') }}
        uses: ./.github/actions/screenshot

      - name: Collect logs and stop QEMU
        if: always()
        env:
          SSH_KEY: ${{ steps.ssh-key.outputs.ssh_key}}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_OPTIONS: ${{ env.SSH_OPTIONS }}
        run: | #sh
          mkdir -p out/journal
          # Journal
          # turn the env string into a Bash array
          read -ra SSH_OPTS <<< "${{ env.SSH_OPTIONS }}"
          ssh "${SSH_OPTS[@]}" \
            -i "$SSH_KEY" \
            -p 2222 \
            ${SSH_USERNAME}@localhost \
              'sudo journalctl -b --no-pager -o short-precise | tail -n +1' > out/journal/boot.log || true
          # Stop QEMU
          echo quit | sudo socat - unix-connect:/tmp/qemu-monitor-sock

      - name: Publish Output to summary
        if: always()
        run: | #sh
          {
            echo "### QEMU Testing Output"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo "#### Journal"
            echo '```'
            cat out/journal/boot.log
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Build cleanup
        if: always()
        uses: ./.github/actions/build-cleanup

  push-latest:
    name: "Push and sign latest tag for: ${{ inputs.image }}"
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-bootc-image
    permissions:
      contents: read
      packages: write
      id-token: write
      artifact-metadata: write
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      attestations: write
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image vars
        uses: ./.github/actions/set-image-vars
        with:
          image: ${{ inputs.image }}

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: (re)tag ${{ env.IMAGE_FULL }}@${{ needs.build-bootc-image.outputs.digest }} as latest
        id: push-latest
        shell: bash
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: | #sh
          printf "%s" "${REGISTRY_PASSWORD}" | skopeo login ghcr.io -u $GITHUB_ACTOR --password-stdin
          skopeo copy --all \
            --digestfile digest.txt \
            "docker://${{ env.IMAGE_FULL }}@${{ needs.build-bootc-image.outputs.digest }}" \
            "docker://${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}"

          #rpm-ostree compose build-chunked-oci --bootc --format-version=1 \
          #  --from="${{ env.IMAGE_FULL }}@${{ needs.build-bootc-image.outputs.digest }}" \
          #  --output containers-storage:${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
          #podman push --digestfile digest.txt "${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}"

          DIGEST=$(cat digest.txt)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Ensure trivy is installed and DB is cached
        uses: ./.github/actions/setup-trivy
        with:
          trivy_version: ${{ env.TRIVY_VERSION }}

      - name: Trivy vuln scan (JSON) - current
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_FULL }}@${{ needs.build-bootc-image.outputs.digest }}
          format: json
          output: ${{ github.workspace }}/current_trivy.json
          ignore-unfixed: true
          skip-setup-trivy: true
          scanners: "vuln"
          vuln-type: "os,library"
          cache: "false"
          timeout: 15m # the default 5m is too short for the large GUI image on a cold runner
          #severity: "CRITICAL,HIGH,MEDIUM"
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign container image
        run: | #sh
          # containers/image (podman, skopeo, bootc) only reads the legacy cosign
          # signature format, stored next to the image as sha256-<digest>.sig
          cosign sign -y --use-signing-config=false --new-bundle-format=false \
            --key env://COSIGN_PRIVATE_KEY ${{ env.IMAGE_FULL }}@${{ env.DIGEST }}
        env:
          DIGEST: ${{ steps.push-latest.outputs.digest }}
          #COSIGN_EXPERIMENTAL: true
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""

      - name: Attach build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: "${{ env.IMAGE_FULL }}"
          subject-digest: ${{ steps.push-latest.outputs.digest }}
          push-to-registry: true

      - name: Cosign attest vulnerability results
        run: |
          # Attach the Trivy JSON as an attestation of type "vuln"
          cosign attest \
            --yes --use-signing-config=false --new-bundle-format=false \
            --key env://COSIGN_PRIVATE_KEY \
            --type vuln \
            --predicate ${{ github.workspace }}/current_trivy.json \
            ${{ env.IMAGE_FULL }}@${{ env.DIGEST }}
        env:
          DIGEST: ${{ steps.push-latest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""

      - name: Verify attestations
        run: | #sh
          set -euo pipefail
          echo "--- cosign vuln attestation ---"
          # the legacy-format vuln attestation lives next to the cert-signed
          # provenance bundle, which a --key lookup would reject
          cosign verify-attestation --new-bundle-format=false \
            --key ./cosign.pub --type vuln \
            "${IMAGE_FULL}@${DIGEST}" > /dev/null
          echo "--- build provenance attestation ---"
          gh attestation verify "oci://${IMAGE_FULL}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push-latest.outputs.digest }}

      - name: Verify
        run: |
          cosign verify --new-bundle-format=false --key ./cosign.pub \
            ${{ env.IMAGE_FULL }}@${DIGEST}
          cosign public-key --key env://COSIGN_PRIVATE_KEY
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-latest.outputs.digest }}
