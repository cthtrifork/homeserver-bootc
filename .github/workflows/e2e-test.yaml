name: E2E test bootc image

# Called once per image, from the end of an image's pipeline (build-bootc-image.yaml) and from e2e.yaml (the `e2e`
# label was added after the image was built). Boots the PR image of the current commit in QEMU and runs the system
# and user tests. A separate workflow so that adding the `e2e` label does not rebuild the images.
on:
  workflow_call:
    inputs:
      image:
        description: "Image to test (homeserver|homeserver-gui|claude-vm)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Both callers can start a test for the same image (a label added just as its build finishes), and the build
  # calls this for every PR image whether or not the PR is labelled, so the PR is checked here, against the API
  # (the event payload can lag behind a label added right after the PR is opened).
  gate:
    name: Check the PR wants e2e
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.pr.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check label, draft state and head commit
        id: pr
        run: | #sh
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{draft: .draft, e2e: ([.labels[].name] | index("e2e") != null), sha: .head.sha}')
          run=false
          if [ "$(jq -r .draft <<< "$pr")" != "false" ]; then
            echo "Draft PR: nothing to test."
          elif [ "$(jq -r .e2e <<< "$pr")" != "true" ]; then
            echo "The PR has no e2e label: nothing to test."
          elif [ "$(jq -r .sha <<< "$pr")" != "$HEAD_SHA" ]; then
            echo "Head moved to $(jq -r .sha <<< "$pr"): a newer run takes over."
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    name: "E2E Test on: ${{ inputs.image }}"
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    # one test per image and PR: a duplicate start or a newer commit supersedes the running one
    concurrency:
      group: e2e-${{ inputs.image }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # homeserver-gui has its own runner due to disksize requirements
    # pinned to 24.04: bootc-image-builder used to fail mounting containers-storage on ubuntu-latest (not re-checked with bootc install)
    runs-on: ${{ inputs.image == 'homeserver-gui' && 'arc-ubuntu' || 'ubuntu-24.04' }}
    continue-on-error: false
    # bootc install of a chunkah image hashes and relabels every file on the client (rechunk shipped a ready ostree
    # commit), so it takes minutes on homeserver and longer on the large GUI image
    timeout-minutes: ${{ inputs.image == 'homeserver-gui' && 45 || 30 }}
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    env:
      SSH_USERNAME: root
      SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5"

    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image vars
        uses: ./.github/actions/set-image-vars
        with:
          image: ${{ inputs.image }}

      - name: Log in to the Container registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Podman
        uses: ./.github/actions/prepare-podman
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          minimal: "true"

      - name: Load ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
        uses: ./.github/actions/load-image
        with:
          run_as_sudo: true
          pull_latest: "false"

      - name: Generate ephemeral SSH keypair
        id: ssh-key
        run: | #sh
          set -e
          mkdir -p out
          ssh-keygen -t ed25519 -N "" -f out/ci_ssh_key
          echo "PUBKEY=$(cat out/ci_ssh_key.pub)" >> $GITHUB_ENV

          echo "ssh_key=./out/ci_ssh_key" >> $GITHUB_OUTPUT

      - name: Write authorized_keys for root SSH access
        run: | #sh
          set -e
          echo "${PUBKEY}" > out/authorized_keys

      - name: Create bootable image
        id: create-vmdk
        uses: ./.github/actions/bootc-install-disk
        with:
          authorized_keys_file: out/authorized_keys

      - name: Boot QEMU (headless) with SSH forward
        env:
          DISK: ${{ steps.create-vmdk.outputs.path }}
        run: | #sh
          set -e
          sudo qemu-system-x86_64 \
            -name bootc-vm \
            -enable-kvm \
            -cpu host \
            -smp "$(nproc)" \
            -m 4G \
            -drive if=virtio,file="${DISK}",format=raw \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::2222-:22 \
            -display none \
            -monitor unix:/tmp/qemu-monitor-sock,server,nowait \
            -daemonize > out/qemu-console.log 2>&1

      - name: Load private key
        id: private_key_path
        env:
          SSH_PRIVATEKEY_B64: ${{ secrets.SSH_PRIVATEKEY_B64 }}
        shell: bash
        run: |
          echo "${SSH_PRIVATEKEY_B64}" | base64 -d > /tmp/ssh_privatekey
          chmod 600 /tmp/ssh_privatekey

          echo "Public key derived from secret:"
          ssh-keygen -y -f /tmp/ssh_privatekey

          echo "private_key_path=/tmp/ssh_privatekey" >> $GITHUB_OUTPUT

      - name: Test (QEMU)
        uses: ./.github/actions/qemu-test
        with:
          SSH_KEY: ${{ steps.ssh-key.outputs.ssh_key}}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_OPTIONS: ${{ env.SSH_OPTIONS }}
          SSH_PRIVATE_KEY: ${{ steps.private_key_path.outputs.private_key_path }}
          IMAGE: ${{ inputs.image }}

      - name: Take QEMU screenshot
        if: ${{ endsWith(inputs.image, 'gui') }}
        uses: ./.github/actions/screenshot

      - name: Collect logs and stop QEMU
        if: always()
        env:
          SSH_KEY: ${{ steps.ssh-key.outputs.ssh_key}}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_OPTIONS: ${{ env.SSH_OPTIONS }}
        run: | #sh
          mkdir -p out/journal
          # Journal
          # turn the env string into a Bash array
          read -ra SSH_OPTS <<< "${{ env.SSH_OPTIONS }}"
          ssh "${SSH_OPTS[@]}" \
            -i "$SSH_KEY" \
            -p 2222 \
            ${SSH_USERNAME}@localhost \
              'sudo journalctl -b --no-pager -o short-precise | tail -n +1' > out/journal/boot.log || true
          # Stop QEMU
          echo quit | sudo socat - unix-connect:/tmp/qemu-monitor-sock

      - name: Publish Output to summary
        if: always()
        run: | #sh
          {
            echo "### QEMU Testing Output"
            echo "<details><summary>Click to expand</summary>"
            echo ""
            echo "#### Journal"
            echo '```'
            cat out/journal/boot.log
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Build cleanup
        if: always()
        uses: ./.github/actions/build-cleanup
