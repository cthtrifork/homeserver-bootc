name: Clean up pull request images
on:
  pull_request:
    types:
      - closed
jobs:
  cancel-runs:
    name: cancel runs of the closed pull request
    # A merge (or close) leaves the pull request's own build, trivy, run-on-pr and e2e jobs running
    # for up to an hour. The merge triggers its own push build on main, which is not touched here:
    # only runs of the pull_request event are cancelled. A fork's token is read-only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # cancel workflow runs
    steps:
      - name: Cancel in-progress and queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Skip this workflow's own run (it has the same head branch).
          for status in in_progress queued waiting; do
            gh run list --branch "$HEAD_REF" --event pull_request --status "$status" \
              --json databaseId --jq '.[].databaseId' --limit 100
          done | sort -u | { grep -vx "$GITHUB_RUN_ID" || true; } | while read -r id; do
            echo "Cancelling run $id"
            gh run cancel "$id" || true
          done

  ghcr-cleanup-image:
    name: delete the ghcr images of the closed pull request
    # A fork's run has no access to the PAT
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    concurrency:
      group: cleanup-images
    permissions: {}
    steps:
      # The PAT owns the packages (GITHUB_TOKEN does not). delete-tags would untag with empty manifests, which GHCR
      # rejects (HTTP 400), so delete whole images and protect all others: latest, main-*, the other PRs' pr-* tags.
      - name: Delete the images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          use-regex: true
          keep-n-tagged: 0
          exclude-tags: ^(latest|main-.*|pr-(?!${{ github.event.pull_request.number }}(-|$)).*)$
          packages: homeserver-bootc/homeserver-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc
