name: Clean up pull request images
on:
  pull_request:
    types:
      - closed
jobs:
  cancel-runs:
    name: cancel runs of the closed pull request
    # A merge (or close) leaves the pull request's own build, trivy, run-on-pr and e2e jobs running
    # for up to an hour. The merge triggers its own push build on main, which is not touched here:
    # only runs of the pull_request event are cancelled. A fork's token is read-only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # cancel workflow runs
    steps:
      - name: Cancel in-progress and queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Skip this workflow's own run (it has the same head branch).
          for status in in_progress queued waiting; do
            gh run list --branch "$HEAD_REF" --event pull_request --status "$status" \
              --json databaseId --jq '.[].databaseId' --limit 100
          done | sort -u | { grep -vx "$GITHUB_RUN_ID" || true; } | while read -r id; do
            echo "Cancelling run $id"
            gh run cancel "$id" || true
          done

  ghcr-cleanup-image:
    name: delete the ghcr images of the closed pull request
    # A fork's run has no access to the PAT
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    concurrency:
      group: cleanup-images
    permissions: {}
    steps:
      # GITHUB_TOKEN does not own the user-owned packages (404 "Package not found"), so both steps use the PAT that
      # cleanup-old-images.yml uses. `delete-tags: pr-<n>` alone cannot work either: an image carries four tags
      # (pr-<n>, pr-<n>-v0.1, pr-<n>-v0.1.<run>, sha-<commit>) and the action only deletes the image once all of its
      # tags are gone, unlinking them one by one, which GHCR rejects with HTTP 400. So list every tag of the pull
      # request's images first and hand the action the complete list.
      - name: List every tag of the pull request's images
        id: tags
        env:
          GH_TOKEN: ${{ secrets.PAT_RENOVATEBOT }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: | #sh
          set -euo pipefail

          all=""
          for image in homeserver-bootc homeserver-gui-bootc claude-vm-bootc; do
            if ! versions=$(gh api --paginate "users/${OWNER}/packages/container/${REPO_NAME}%2F${image}/versions?per_page=100"); then
              echo "::error::could not list the versions of ${REPO_NAME}/${image}"
              exit 1
            fi
            # Versions with a pr-<n> or pr-<n>-* tag, never one that also carries latest or a main-* tag
            found=$(jq -r --arg tag "pr-${PR_NUMBER}" '
              .[] | .metadata.container.tags as $t
              | select(($t | any(. == $tag or startswith($tag + "-")))
                and (($t | any(. == "latest" or startswith("main-"))) | not))
              | $t[]' <<< "$versions")
            all="${all}"$'\n'"${found}"
          done

          tags=$(sed '/^$/d' <<< "$all" | sort -u | paste -sd, -)
          echo "Tags of pr-${PR_NUMBER} images: ${tags:-none}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Delete the images
        if: steps.tags.outputs.tags != ''
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.PAT_RENOVATEBOT }}
          delete-tags: ${{ steps.tags.outputs.tags }}
          exclude-tags: latest,main-*
          packages: homeserver-bootc/homeserver-bootc,homeserver-bootc/homeserver-gui-bootc,homeserver-bootc/claude-vm-bootc
