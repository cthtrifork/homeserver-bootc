name: Clean up pull request images
on:
  pull_request:
    types:
      - closed
jobs:
  cancel-runs:
    name: cancel runs of the closed pull request
    # A merge (or close) leaves the pull request's own build, trivy, run-on-pr and e2e jobs running
    # for up to an hour. The merge triggers its own push build on main, which is not touched here:
    # only runs of the pull_request event are cancelled. A fork's token is read-only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # cancel workflow runs
    steps:
      - name: Cancel in-progress and queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Skip this workflow's own run (it has the same head branch).
          for status in in_progress queued waiting; do
            gh run list --branch "$HEAD_REF" --event pull_request --status "$status" \
              --json databaseId --jq '.[].databaseId' --limit 100
          done | sort -u | { grep -vx "$GITHUB_RUN_ID" || true; } | while read -r id; do
            echo "Cancelling run $id"
            gh run cancel "$id" || true
          done

  ghcr-cleanup-image:
    name: delete the ghcr images of the closed pull request
    # A fork's run has no access to the PAT
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 15
    concurrency:
      group: cleanup-images
    permissions: {}
    steps:
      # GITHUB_TOKEN does not own the user-owned packages (404 "Package not found"), so this uses the same PAT as
      # cleanup-old-images.yml. dataaxiom/ghcr-cleanup-action is not used with delete-tags: an image carries four tags
      # (pr-<n>, pr-<n>-v0.1, pr-<n>-v0.1.<run>, sha-<commit>) and untagging them one by one is rejected with HTTP 400.
      # Deleting the whole package version removes all of its tags at once.
      - name: Delete the image versions tagged pr-<number>
        env:
          GH_TOKEN: ${{ secrets.PAT_RENOVATEBOT }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: | #sh
          set -euo pipefail

          status=0
          for image in homeserver-bootc homeserver-gui-bootc claude-vm-bootc; do
            package="${REPO_NAME}%2F${image}"
            if ! versions=$(gh api --paginate "users/${OWNER}/packages/container/${package}/versions?per_page=100"); then
              echo "::error::could not list the versions of ${REPO_NAME}/${image}"
              status=1
              continue
            fi

            # Versions with a pr-<n> or pr-<n>-* tag, never one that also carries latest or a main-* tag
            ids=$(jq -r --arg tag "pr-${PR_NUMBER}" '
              .[] | .metadata.container.tags as $t
              | select(($t | any(. == $tag or startswith($tag + "-")))
                and (($t | any(. == "latest" or startswith("main-"))) | not))
              | .id' <<< "$versions")

            if [ -z "$ids" ]; then
              echo "${image}: no image for pr-${PR_NUMBER}"
              continue
            fi
            while read -r id; do
              echo "${image}: deleting version ${id}"
              gh api -X DELETE "users/${OWNER}/packages/container/${package}/versions/${id}" || status=1
            done <<< "$ids"
          done
          exit "$status"
