name: "Set BootC image vars"
description: "Resolve IMAGE_NAME and related variables based on image type"
inputs:
  image:
    description: "Image selector (homeserver|homeserver-gui|claude-vm)"
    required: true
  allocate_version:
    description: "On main, allocate the next <yyyyMMdd>-<rev> UNIQUE_VERSION. Only the job that publishes should set this, so the revision is allocated once per run."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set environment variables
      id: set-env
      shell: bash
      run: | #sh
        set -eo pipefail

        case "${{ inputs.image }}" in
          homeserver)
            IMAGE_NAME="homeserver-bootc"
            CONTAINERFILE="homeserver.containerfile"
            ;;
          homeserver-gui)
            IMAGE_NAME="homeserver-gui-bootc"
            CONTAINERFILE="homeserver-gui.containerfile"
            ;;
          claude-vm)
            IMAGE_NAME="claude-vm-bootc"
            CONTAINERFILE="claude-vm.containerfile"
            ;;
          *)
            echo "Unsupported image type: '${{ inputs.image }}'." >&2
            echo "Expected one of: homeserver, homeserver-gui, claude-vm." >&2
            exit 1
            ;;
        esac
        VERSION="v0.1"
        SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
        DOCKER_TAG=""
        PR_NUMBER='${{ github.event.pull_request.number }}'
        if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
          DOCKER_TAG="${{github.ref_name}}-${VERSION}" # e.g., main-0.1
        else
          DOCKER_TAG="pr-${PR_NUMBER}-${VERSION}"
        fi
        if [ "${{ inputs.allocate_version }}" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          # <yyyyMMdd>-<rev>: rev is a per-day, per-image counter derived from the release tags
          # (<image>_<yyyyMMdd>-<rev>) already on the remote. main builds of one image are
          # serialized by the concurrency group, so the counter does not race.
          TODAY="$(date -u +%Y%m%d)"
          LAST_REV="$(git ls-remote --tags --refs origin "refs/tags/${IMAGE_NAME}_${TODAY}-*" \
            | sed -E 's|.*-([0-9]+)$|\1|' | sort -n | tail -n1)"
          UNIQUE_VERSION="${TODAY}-$(( ${LAST_REV:-0} + 1 ))"
        else
          UNIQUE_VERSION="${DOCKER_TAG}.${{ github.run_number }}"
        fi
        echo "DOCKER_TAG=${DOCKER_TAG}" >> "$GITHUB_ENV"
        echo "UNIQUE_VERSION=${UNIQUE_VERSION}" >> "$GITHUB_ENV"
        
        echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
        echo "IMAGE_FULL=ghcr.io/${{ github.repository }}/${IMAGE_NAME}" >> "$GITHUB_ENV"
        echo "LOCAL_PR_IMAGE=localhost/${IMAGE_NAME}:${DOCKER_TAG}" >> "$GITHUB_ENV"
        echo "CONTAINERFILE=${CONTAINERFILE}" >> "$GITHUB_ENV"


