name: "Push image"
description: "Push container images to the registry"
inputs:
  github_token:
    description: "Token with permissions to push/copy images (pass secrets.GITHUB_TOKEN or a PAT)"
    required: true
  oci_ref:
    description: "ref to oci artifact"
    required: true
outputs:
  digest: # id of the output
    description: "The digest of the pushed image"
    value: ${{ steps.push-to-ghcr.outputs.digest }}
runs:
  using: "composite"
  steps:
    - name: Login with skopeo
      shell: bash
      run:  echo "${{ inputs.github_token }}" | skopeo login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
    - name: Push to Container registry
      if: ${{ runner.environment != 'self-hosted' || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'push') }}
      id: push-to-ghcr
      shell: bash
      run: | #sh
        SOURCE="${IMAGE_REF}"
        DEST="${IMAGE_FULL}:${DOCKER_TAG}"
          
        # Push OCI layout directly to GHCR
        sudo skopeo copy \
          --all \
          "${SOURCE}" \
          "docker://${DEST}"
          
        # Add additional tags remotely — no blob transfer
        crane tag "${DEST}" "${UNIQUE_VERSION}"
          
        # Get digest from remote registry
        IMAGE_DIGEST="$(crane digest "${DEST}")"
          
        echo "image=${DEST}" >> "${GITHUB_OUTPUT}"
        echo "digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"
          
        echo "Adding additional tags to ${{ env.IMAGE_FULL }}@${IMAGE_DIGEST}"
        for tag in $TAGS; do
          skopeo copy -q --all \
            "docker://${{ env.IMAGE_FULL }}@${IMAGE_DIGEST}" \
            "docker://${{ env.IMAGE_FULL }}:${tag}"
        done
      env:
        TAGS: ${{ steps.metadata.outputs.tags }}
        SOURCE: "${IMAGE_FULL}:${DOCKER_TAG}"
        IMAGE_REF: ${{ inputs.oci_ref }}

    - name: Push to cache registry
      if: ${{ runner.environment == 'self-hosted' && github.event_name == 'pull_request' }}
      shell: bash
      run: | #sh
        SOURCE="${IMAGE_REF}"
        DEST="localhost:5000/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}"
          
        # Push OCI layout directly to GHCR
        sudo skopeo copy \
          --all \
          --dest-tls-verify=false \
          "${SOURCE}" \
          "docker://${DEST}"
      env:
        IMAGE_REF: ${{ inputs.oci_ref }}
