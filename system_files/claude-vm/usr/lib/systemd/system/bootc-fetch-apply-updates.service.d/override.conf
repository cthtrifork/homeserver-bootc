# Stage the new image but do not reboot: a reboot would end any running Claude Remote Control session.
# The update is applied on the next reboot (sudo systemctl reboot) when it suits you.
# To reboot automatically instead, use: ExecStart=/usr/bin/bootc upgrade --apply --quiet
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Nice=19
IOSchedulingClass=idle
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
# Leave a marker when an update is staged; a Claude Code SessionStart hook reports it. The '-' ignores failures.
ExecStartPost=-/usr/libexec/claude-vm/note-staged-update
