# Stage the new image and reboot into it when one was staged (--apply). The timer runs at 03:00, when the VM
# is normally idle; a reboot ends any running Claude Remote Control session. To only stage, drop --apply.
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --apply --quiet
# Leave a marker when an update is staged (only reached when --apply did not reboot); a Claude Code SessionStart hook reports it. The '-' ignores failures.
ExecStartPost=-/usr/libexec/claude-vm/note-staged-update
