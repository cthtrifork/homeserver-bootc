# glibc's nss-resolve asks systemd-resolved over this world-accessible varlink socket, which bypasses the nft DNS
# redirect and so the DNS allowlist (getent, curl, python and git would resolve any name). Make it root-only: other
# users then fall back to the "dns" NSS module, which reads /etc/resolv.conf (the 127.0.0.53 stub) and is filtered.
[Socket]
SocketMode=0600
