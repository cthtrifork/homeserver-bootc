# Admin user: same name/UID as the homeserver image. Key-only SSH (authorized_keys.pub), sudo via wheel.
u caspertdk 1010 "Casper Thygesen" /var/home/caspertdk /bin/bash
m caspertdk wheel
# Unprivileged account the Claude Code remote-control service runs as.
# Not in wheel: no sudo. Fixed UID so /var/home/claude ownership survives upgrades.
u claude 1100 "Claude Code agent" /var/home/claude /bin/bash
# Second, isolated agent account (own home, login, podman storage, GitHub identity; no access to claude's files or token).
# Runs claude-remote-control-isolated.service. Fixed UID: the egress allowlist and subuid range are keyed on it.
u claude-work-isolated 1101 "Claude Code agent (work, isolated)" /var/home/claude-work-isolated /bin/bash
