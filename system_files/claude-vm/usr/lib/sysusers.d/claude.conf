# Admin user: same name/UID as the homeserver image. Key-only SSH (authorized_keys.pub), sudo via wheel.
u caspertdk 1010 "Casper Thygesen" /var/home/caspertdk /bin/bash
m caspertdk wheel
# Unprivileged account the Claude Code remote-control service runs as.
# Not in wheel: no sudo. Fixed UID so /var/home/claude ownership survives upgrades.
u claude 1100 "Claude Code agent" /var/home/claude /bin/bash
# Second agent account for the personal Claude login, a separate Unix user from claude (the existing login): own home, login, podman
# storage and GitHub identity; no access to claude's files or token. Runs claude-remote-control-rc-personal.service.
# Fixed UID: the egress allowlist and subuid range are keyed on it.
u claude-rc-personal 1101 "Claude Code agent (rc personal)" /var/home/claude-rc-personal /bin/bash
# Containers run as these users, not as the agents (claude-vm-podman@<agent>.service): they cannot read the agent's home, so
# no mount flag can expose its login, signing key or token. No login shell, no sudo, own group. Fixed UIDs: the egress
# allowlist (nft) and the subuid ranges in the containerfile are keyed on them.
u claude-podman 1200 "Podman for claude" /var/home/claude-podman /usr/sbin/nologin
u claude-rc-personal-podman 1201 "Podman for claude-rc-personal" /var/home/claude-rc-personal-podman /usr/sbin/nologin
# Only this group may exec the real /usr/bin/podman (the agents get a wrapper that talks to the API instead). Fixed GID: the
# containerfile chgrps by number because sysusers has not run at build time.
g claude-podman-exec 1210 -
m claude-podman claude-podman-exec
m claude-rc-personal-podman claude-podman-exec
