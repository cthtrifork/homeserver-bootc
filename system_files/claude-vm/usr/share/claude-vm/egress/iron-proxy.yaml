# iron-proxy of the egress gateway: one instance per agent user and one for their containers (claude-vm-egress-proxy@<instance>).
# proxy-<instance>.env overrides the addresses (IRON_*); the values here are the claude user's. It is also the DNS server: every name
# resolves to proxy_ip, and names off the allowlist get a 403. See docs/claude-vm/README.md.
dns:
  listen: "198.18.0.2:53"
  proxy_ip: "198.18.0.2"
proxy:
  http_listen: "198.18.0.2:80"
  https_listen: "198.18.0.2:443"
metrics:
  listen: "127.0.0.1:19090" # the default is :9090 on every address
tls:
  ca_cert: /var/lib/claude-vm/ca/ca.crt # made by claude-vm-egress-ca
  ca_key: /var/lib/claude-vm/ca/ca.key
transforms:
  # The allowlist: default deny. "*.example.com" covers example.com and its subdomains. claude-vm-egress reads it with yq.
  - name: allowlist
    config:
      domains:
        - "*.anthropic.com"
        - "*.api.first.org"
        - "*.astral.sh"
        - "*.blob.core.windows.net"
        - "*.bun.sh"
        - "*.cgr.dev"
        - "*.claude.ai"
        - "*.claude.com"
        - "*.cloudflare.com"
        - "*.context7.com"
        - "*.crates.io"
        - "*.debian.org"
        - "*.developer.apple.com"
        - "*.developer.mozilla.org"
        - "*.developers.redhat.com"
        - "*.docker.com"
        - "*.docker.io"
        - "*.docs.python.org"
        - "*.fedoraproject.org"
        - "*.files.pythonhosted.org"
        - "*.fluxcd.io"
        - "*.frame.claudeusercontent.com"
        - "*.frame.staging.claudeusercontent.com"
        - "*.gcr.io"
        - "*.ghcr.io"
        - "*.github.blog"
        - "*.github.com"
        - "*.githubassets.com"
        - "*.githubcopilot.com"
        - "*.githubusercontent.com"
        - "*.go.dev"
        - "*.json.schemastore.org"
        - "*.kubernetes.io"
        - "*.mcr.microsoft.com"
        - "*.nodejs.org"
        - "*.npmjs.com"
        - "*.npmjs.org"
        - "*.nuget.org"
        - "*.nvd.nist.gov"
        - "*.oneuptime.com"
        - "*.osv.dev"
        - "*.plugins.gradle.org"
        - "*.portableinfo.cloud"
        - "*.proxy.golang.org"
        - "*.pypi.org"
        - "*.quay.io"
        - "*.readthedocs.io"
        - "*.registry.access.redhat.com"
        - "*.registry.k8s.io"
        - "*.repo.maven.apache.org"
        - "*.rubygems.org"
        - "*.rustup.rs"
        - "*.s3.amazonaws.com"
        - "*.security.snyk.io"
        - "*.sigstore.dev"
        - "*.stackoverflow.com"
        - "*.static.rust-lang.org"
        - "*.storage.googleapis.com"
        - "*.sum.golang.org"
        - "*.wails.io"
        - "*.webkit.org"
        - "*.wikipedia.org"
        - "*.www.cisa.gov"

  # The agent sends the placeholder "proxy-gh-token" (gh, the git credential helper) and the proxy swaps in the user's GitHub token in
  # Bearer, token and Basic Authorization headers; a request without it passes unchanged. Nothing to swap in the containers' sni-only instance.
  - name: secrets
    config:
      secrets:
        - source: {type: file, path: /run/claude-vm/egress/current/github-token, ttl: 1m}
          proxy_value: proxy-gh-token
          match_headers: [Authorization]
          rules:
            - host: api.github.com
              require_tls: true
            - host: uploads.github.com
              require_tls: true
            - host: github.com
              require_tls: true
            - host: gist.github.com
              require_tls: true

log:
  level: info
