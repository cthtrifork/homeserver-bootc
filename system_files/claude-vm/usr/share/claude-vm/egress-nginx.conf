# Allowlist proxy for the agent's redirected traffic; the maps are generated into /run/claude-vm/egress.
# https: reads the SNI from the TLS ClientHello (no interception, no CA) and connects to that *name* itself, so the
# IP the client wanted is ignored. http: matches the Host header. Not on the list: dropped (https) / 403 (http).
daemon off;
pid /dev/null;
error_log stderr warn;
worker_processes 1;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }

stream {
    resolver 127.0.0.53 ipv6=off valid=30s;
    map $ssl_preread_server_name $sni_target {
        include /run/claude-vm/egress/sni.map;
    }
    server {
        listen 127.0.0.1:3129;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_pass $sni_target;
    }
}

http {
    access_log off;
    resolver 127.0.0.53 ipv6=off valid=30s;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $host $host_ok {
        include /run/claude-vm/egress/host.map;
    }
    server {
        listen 127.0.0.1:3128;
        server_name _;
        if ($host_ok = 0) { return 403 "blocked by the claude-vm egress allowlist\n"; }
        location / {
            proxy_pass http://$host;
            proxy_set_header Host $http_host;
        }
    }
}
