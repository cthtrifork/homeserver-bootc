# Allowlist proxy for the agent's redirected traffic (see egress.nft); the allowlist is generated at image build time (build_files/claude-vm/egress_allowlist.py).
# https: reads the SNI of the TLS ClientHello (no interception, no CA) and connects to that *name* itself, so the IP
# the client asked for is ignored. http: matches the Host header. Not on the list: dropped (https) / 403 (http).
# Blocked requests are logged to the journal (`journalctl -u claude-vm-egress-proxy -g egress_blocked`) through syslog: nginx's access_log has no
# stderr target, and /dev/stderr is a socket it cannot open.
# "hostnames" makes ".example.com" match example.com and every subdomain.
daemon off;
pid /dev/null;
error_log stderr warn;
worker_processes 1;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }

stream {
    resolver 127.0.0.53 ipv6=off valid=30s;

    map $ssl_preread_server_name $sni_allowed {
        hostnames;
        default 0;
        include /usr/share/claude-vm/egress/nginx-allow.map;
    }
    map $sni_allowed $sni_target {
        1       $ssl_preread_server_name:443;
        default 127.0.0.1:9;    # discard port: the client sees a reset
    }

    map $sni_allowed $sni_blocked { 1 0; default 1; }
    log_format blocked 'https $ssl_preread_server_name client=$remote_addr';
    access_log syslog:server=unix:/dev/log,tag=egress_blocked blocked if=$sni_blocked;

    server {
        listen 127.0.0.1:8443;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_pass $sni_target;
    }
}

http {
    resolver 127.0.0.53 ipv6=off valid=30s;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $host $host_allowed {
        hostnames;
        default 0;
        include /usr/share/claude-vm/egress/nginx-allow.map;
    }

    map $host_allowed $host_blocked { 1 0; default 1; }
    log_format blocked 'http $host client=$remote_addr';
    access_log syslog:server=unix:/dev/log,tag=egress_blocked blocked if=$host_blocked;

    server {
        listen 127.0.0.1:8008;
        server_name _;
        if ($host_allowed = 0) { return 403 "blocked by the claude-vm egress allowlist\n"; }
        location / {
            proxy_pass http://$host;
            proxy_set_header Host $http_host;
        }
    }
}
