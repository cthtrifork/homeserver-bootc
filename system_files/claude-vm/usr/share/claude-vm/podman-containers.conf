# containers.conf for the <agent>-podman users (claude-vm-podman@.service sets CONTAINERS_CONF to this root-owned file).
# Not a security control by itself: the boundary is that <agent>-podman is another UID that cannot read the agent's secrets.
[containers]
# No SELinux label separation: container_t could not read the agent's workspace, which is shared by file permissions (ACL).
label = false
# The egress gateway terminates TLS for GitHub (to add the token) with its own CA, so containers must trust it: give them the
# host's bundle (system CAs plus that CA) at the usual places and point the common runtimes at it.
volumes = [
    "/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/ssl/certs/ca-certificates.crt:ro",
    "/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/pki/tls/certs/ca-bundle.crt:ro",
]
env = [
    "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt",
    "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt",
    "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt",
    "CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt",
]

[engine]
# no systemd user manager for these users
cgroup_manager = "cgroupfs"
events_logger = "file"
