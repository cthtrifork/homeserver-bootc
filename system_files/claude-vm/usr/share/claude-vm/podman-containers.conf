# containers.conf for the <agent>-podman users (claude-vm-podman@.service sets CONTAINERS_CONF to this root-owned file).
# Not a security control by itself: the boundary is that <agent>-podman is another UID that cannot read the agent's secrets.
[containers]
# No SELinux label separation: container_t could not read the agent's workspace, which is shared by file permissions (ACL).
label = false

[engine]
# no systemd user manager for these users
cgroup_manager = "cgroupfs"
events_logger = "file"
