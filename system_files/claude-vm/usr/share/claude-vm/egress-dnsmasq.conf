# DNS filter of the egress gateway: only the domains of the allowlist (listed in /run/claude-vm-egress-dns/servers at start) are forwarded,
# to the system resolver stub; with no default upstream everything else is REFUSED.
port=53
listen-address=127.0.0.55
bind-interfaces
no-resolv
no-hosts
cache-size=1000
conf-file=/run/claude-vm-egress-dns/servers
