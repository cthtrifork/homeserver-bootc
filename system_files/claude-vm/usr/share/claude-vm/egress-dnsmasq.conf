# Allowlist DNS filter for the agent: only the domains in dnsmasq-servers (generated by egress-generate) are forwarded,
# to the system resolver stub; with no default upstream everything else is REFUSED.
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
cache-size=1000
conf-file=/run/claude-vm/egress/dnsmasq-servers
