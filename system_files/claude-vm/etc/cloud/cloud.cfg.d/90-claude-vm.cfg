# cloud-init only injects per-VM data into claude-vm (write_files, runcmd): KubeVirt's cloudInitNoCloud disk, for example
# carries the GitHub App key. Everything else belongs to the image: users, SSH keys and host keys, hostname, network.
#
# Only NoCloud is listed, so ds-identify leaves cloud-init off on a VM without a "cidata" disk (the default) and the image
# behaves as it did without cloud-init. Do not add "None": it would turn cloud-init on everywhere.
datasource_list: [NoCloud]

# the image's own NetworkManager config stays in charge, no fallback DHCP rendering
network:
  config: disabled
preserve_hostname: true
manage_etc_hosts: false

# These lists replace the package defaults (which create a "fedora" user, touch SSH keys, set the hostname and grow the root).
# runcmd only writes a script; scripts_user runs it in the final stage, after multi-user.target, so it may call systemctl.
# The root is grown by bootc-generic-growpart.service in the base image.
cloud_init_modules:
  - write_files
cloud_config_modules:
  - runcmd
cloud_final_modules:
  - scripts_user
