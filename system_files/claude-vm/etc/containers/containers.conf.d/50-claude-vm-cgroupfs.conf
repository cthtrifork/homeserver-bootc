# Rootless podman for the claude user runs inside a session whose cgroup tree is read-only, so the default systemd
# cgroup manager fails to create a scope ("create directory /sys/fs/cgroup/...: Read-only file system"), most visibly
# in `podman build` and `devcontainer up`. cgroupfs avoids that.
# A drop-in (not /etc/containers/containers.conf) so the packaged defaults stay untouched.
[engine]
cgroup_manager = "cgroupfs"
