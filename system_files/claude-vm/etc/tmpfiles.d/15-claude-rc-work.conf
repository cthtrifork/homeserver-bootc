# Home of the agent account claude-rc-work (UID 1101, see sysusers.d/claude.conf). Mirrors
# 10-claude-home.conf, but its own tree: nothing here is shared with /var/home/claude.
d /var/home/claude-rc-work                            0700 1101 1101 - -
z /var/home/claude-rc-work                            -    -    -    - -
d /var/home/claude-rc-work/workspace                  0755 1101 1101 - -
z /var/home/claude-rc-work/workspace                  -    -    -    - -
C /var/home/claude-rc-work/.gitconfig                 0644 1101 1101 - /usr/share/claude-vm/claude-rc-work.gitconfig
Z /var/home/claude-rc-work/.gitconfig                 - - - -
C /var/home/claude-rc-work/.claude.json               0600 1101 1101 - /usr/share/claude-vm/claude.json
d /var/home/claude-rc-work/.claude                    0700 1101 1101 - -
d /var/home/claude-rc-work/.claude/commands           0755 1101 1101 - -
L+ /var/home/claude-rc-work/.claude/commands/ssh-address.md - - - - /usr/share/claude-vm/commands/ssh-address.md
# Lingering, so /run/user/1101 exists for its rootless podman and podman.socket (see 14-claude-podman-linger.conf).
f /var/lib/systemd/linger/claude-rc-work              0644 root root - -
