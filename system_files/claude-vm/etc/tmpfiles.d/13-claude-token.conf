# /etc/claude-vm holds the GitHub App credentials, one directory per agent user (root only; only the token refresher reads them).
d /etc/claude-vm                                            0700 root root - -
Z /etc/claude-vm                                            -    -    -    - -
# The agents never see their GitHub token: refresh-github-token writes it where only the egress gateway (Envoy) reads it, as the
# SDS secret files the gateway watches (one per agent user and intercepted host group, see egress_allowlist.py). The `f` lines
# create an empty credential, so the gateway starts before (or without) the GitHub App: it then sends requests unauthenticated.
d /run/claude-vm                                            0755 root root - -
d /run/claude-vm/envoy                                      0750 root envoy - -
f /run/claude-vm/envoy/claude-api.json                      0640 root envoy - {"resources":[{"@type":"type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret","name":"credential","generic_secret":{"secret":{"inline_string":""}}}]}
f /run/claude-vm/envoy/claude-git.json                      0640 root envoy - {"resources":[{"@type":"type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret","name":"credential","generic_secret":{"secret":{"inline_string":""}}}]}
f /run/claude-vm/envoy/claude-rc-personal-api.json          0640 root envoy - {"resources":[{"@type":"type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret","name":"credential","generic_secret":{"secret":{"inline_string":""}}}]}
f /run/claude-vm/envoy/claude-rc-personal-git.json          0640 root envoy - {"resources":[{"@type":"type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret","name":"credential","generic_secret":{"secret":{"inline_string":""}}}]}
# The CA that signs the certificates of the intercepted hosts: its key is root-only and never readable by Envoy or an agent; the
# certificates and their keys are what Envoy reads (made by claude-vm-egress-ca.service).
d /var/lib/claude-vm                                        0755 root root - -
d /var/lib/claude-vm/ca-private                             0700 root root - -
d /var/lib/claude-vm/ca                                     0750 root envoy - -
