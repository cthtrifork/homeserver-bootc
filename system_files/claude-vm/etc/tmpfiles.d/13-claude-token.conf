# /etc/claude-vm holds the GitHub App credentials, one directory per agent user (root only; only the token refresher reads them).
d /etc/claude-vm                                            0700 root root - -
Z /etc/claude-vm                                            -    -    -    - -
# The agents never see their GitHub token: refresh-github-token writes it where only the egress gateway (iron-proxy) reads it
# (/run/claude-vm/egress/<user>-github-token), and the gateway swaps it in for the placeholder the agent sends. Until the file
# exists, requests carrying the placeholder to the GitHub API are refused (403), and anonymous reads still work.
d /run/claude-vm                                            0755 root root - -
d /run/claude-vm/egress                                     0750 root ironproxy - -
# The CA the gateway signs its certificates with (made by claude-vm-egress-ca.service). Its key is readable by the gateway only;
# the agents trust the certificate.
d /var/lib/claude-vm                                        0755 root root - -
d /var/lib/claude-vm/ca                                     0750 root ironproxy - -
