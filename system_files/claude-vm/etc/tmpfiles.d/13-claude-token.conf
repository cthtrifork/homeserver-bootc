# /etc/claude-vm holds the GitHub App credentials, one directory per agent user (root only; only the token refresher reads them).
d /etc/claude-vm                                            0700 root root - -
Z /etc/claude-vm                                            -    -    -    - -
# /run/claude-vm/<user> holds that user's one-hour installation token, readable by that user alone.
d /run/claude-vm                                            0755 root root - -
d /run/claude-vm/claude                                     0750 root claude - -
d /run/claude-vm/claude-rc-personal                         0750 root claude-rc-personal - -
