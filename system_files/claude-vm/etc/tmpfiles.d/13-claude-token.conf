# /etc/claude-vm holds the GitHub App credentials (root only; only the token refresher reads them).
d /etc/claude-vm                                            0700 root root - -
Z /etc/claude-vm                                            -    -    -    - -
# /run/claude-vm holds the one-hour installation token, readable by the claude user.
d /run/claude-vm                                            0750 root claude - -
