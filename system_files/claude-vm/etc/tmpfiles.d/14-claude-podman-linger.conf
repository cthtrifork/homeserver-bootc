# Enable lingering for claude (equivalent to: loginctl enable-linger claude) so /run/user/1100 exists
# for the remote-control service's rootless podman and its API socket (podman.socket, enabled globally).
d /var/lib/systemd/linger                                   0755 root root - -
f /var/lib/systemd/linger/claude                            0644 root root - -
