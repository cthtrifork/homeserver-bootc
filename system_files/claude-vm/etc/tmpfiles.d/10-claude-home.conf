# z (not Z) on the home dirs: Z would re-walk repos, caches and container storage on every boot.
# sudo SYSTEMD_LOG_LEVEL=debug systemd-tmpfiles --create system_files/claude-vm/etc/tmpfiles.d/10-claude-home.conf --dry-run --no-pager
d /var/home/claude                                          0700 1100 1100 - -
z /var/home/claude                                          -    -    -    - -
d /var/home/claude/workspace                                0755 1100 1100 - -
z /var/home/claude/workspace                                -    -    -    - -
C /var/home/claude/.gitconfig                               0644 1100 1100 - /usr/share/claude-vm/claude.gitconfig
Z /var/home/claude/.gitconfig                               - - - -
# User-scope MCP servers. C copies only if the file is missing; Claude Code rewrites it afterwards.
C /var/home/claude/.claude.json                             0600 1100 1100 - /usr/share/claude-vm/claude.json
# /ssh-address slash command. A symlink (L+, not C) so it follows the image on upgrade.
d /var/home/claude/.claude                                  0700 1100 1100 - -
d /var/home/claude/.claude/commands                         0755 1100 1100 - -
L+ /var/home/claude/.claude/commands/ssh-address.md         - - - - /usr/share/claude-vm/commands/ssh-address.md
# cluster-ops: thin relay subagent (Haiku) that asks the claude-k8s-helper session about live cluster state. Symlink, so it follows the image.
d /var/home/claude/.claude/agents                           0755 1100 1100 - -
L+ /var/home/claude/.claude/agents/cluster-ops.md           - - - - /usr/share/claude-vm/agents/cluster-ops.md
