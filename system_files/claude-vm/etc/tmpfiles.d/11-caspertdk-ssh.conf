# sudo SYSTEMD_LOG_LEVEL=debug systemd-tmpfiles --create system_files/claude-vm/etc/tmpfiles.d/11-caspertdk-ssh.conf --dry-run --no-pager
# Public key only. authorized_keys.pub is copied from system_files/homeserver at build time (single source of truth).
# Deliberately no id_ed25519 here: this VM carries no private keys.
d /var/home/caspertdk                                       0750 1010 1010 - -
z /var/home/caspertdk                                       -    -    -    - -
d /var/home/caspertdk/.ssh                                  0700 1010 1010 - -
Z /var/home/caspertdk/.ssh                                  -    -    -    - -
C /var/home/caspertdk/.ssh/authorized_keys                  0600 1010 1010 - /usr/share/claude-vm/authorized_keys.pub
Z /var/home/caspertdk/.ssh/authorized_keys                  - - - -
