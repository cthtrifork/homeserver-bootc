# Home of the agent account claude-rc-personal (UID 1101, see sysusers.d/claude.conf). Mirrors
# 10-claude-home.conf, but its own tree: nothing here is shared with /var/home/claude.
d /var/home/claude-rc-personal                            0700 1101 1101 - -
z /var/home/claude-rc-personal                            -    -    -    - -
d /var/home/claude-rc-personal/workspace                  0755 1101 1101 - -
z /var/home/claude-rc-personal/workspace                  -    -    -    - -
C /var/home/claude-rc-personal/.gitconfig                 0644 1101 1101 - /usr/share/claude-vm/claude-rc-personal.gitconfig
Z /var/home/claude-rc-personal/.gitconfig                 - - - -
C /var/home/claude-rc-personal/.claude.json               0600 1101 1101 - /usr/share/claude-vm/claude.json
d /var/home/claude-rc-personal/.claude                    0700 1101 1101 - -
d /var/home/claude-rc-personal/.claude/commands           0755 1101 1101 - -
L+ /var/home/claude-rc-personal/.claude/commands/ssh-address.md - - - - /usr/share/claude-vm/commands/ssh-address.md
# User-level Haiku subagents, as in 10-claude-home.conf.
d /var/home/claude-rc-personal/.claude/agents             0755 1101 1101 - -
L+ /var/home/claude-rc-personal/.claude/agents/cluster-ops.md - - - - /usr/share/claude-vm/agents/cluster-ops.md
L+ /var/home/claude-rc-personal/.claude/agents/ci-triage.md - - - - /usr/share/claude-vm/agents/ci-triage.md
L+ /var/home/claude-rc-personal/.claude/agents/lint-runner.md - - - - /usr/share/claude-vm/agents/lint-runner.md
L+ /var/home/claude-rc-personal/.claude/agents/researcher.md - - - - /usr/share/claude-vm/agents/researcher.md
# Lingering, so /run/user/1101 exists for its rootless podman and podman.socket (see 14-claude-podman-linger.conf).
f /var/lib/systemd/linger/claude-rc-personal              0644 root root - -
