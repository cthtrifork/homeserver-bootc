# Config dir of the optional second Claude account (claude-remote-control@work.service, CLAUDE_CONFIG_DIR). Same seeding
# as the default account in 10-claude-home.conf: user-scope MCP servers and the /ssh-address slash command.
d /var/home/claude/.claude-work                             0700 1100 1100 - -
C /var/home/claude/.claude-work/.claude.json                0600 1100 1100 - /usr/share/claude-vm/claude.json
d /var/home/claude/.claude-work/commands                    0755 1100 1100 - -
L+ /var/home/claude/.claude-work/commands/ssh-address.md    - - - - /usr/share/claude-vm/commands/ssh-address.md
