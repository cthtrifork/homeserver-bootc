# Podman users: containers run as <agent>-podman, not as the agent (see sysusers.d/claude.conf, claude-vm-podman@.service).
# Their homes hold image and container storage only; nothing of the agent's.
d /var/home/claude-podman                                 0700 1200 1200 - -
z /var/home/claude-podman                                 -    -    -    - -
d /var/home/claude-rc-personal-podman                     0700 1201 1201 - -
z /var/home/claude-rc-personal-podman                     -    -    -    - -
# The API socket lives in a directory owned by the podman user with the AGENT's group (setgid, so the socket inherits it
# and UMask=0007 makes it 0660): only that agent can connect to its podman, not the other agent.
d /run/claude-vm-podman                                   0755 root root - -
d /run/claude-vm-podman/claude                            2750 1200 1100 - -
d /run/claude-vm-podman/claude-rc-personal                2750 1201 1101 - -
d /run/claude-vm-podman-run                               0755 root root - -
d /var/lib/claude-vm                                      0755 root root - -
