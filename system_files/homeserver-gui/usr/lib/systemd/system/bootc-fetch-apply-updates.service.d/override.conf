# we dont want to reboot the system after applying updates, as its probably a client machine (laptop) and not a server
[Unit]
# Wait for the network, and do not spend battery or a metered connection on a download: the daily timer
# is Persistent, so a skipped run happens at the next opportunity.
Wants=network-online.target
After=network-online.target
ConditionACPower=true

[Service]
Nice=19
IOSchedulingClass=idle
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
