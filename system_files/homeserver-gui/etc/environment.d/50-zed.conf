# Zed is seeded by the image (build_files/gui/11-gui-zed-editor.sh) and restored by the dotfiles
# sync on every boot, so its self-updater must not run. Setting ZED_UPDATE_EXPLANATION makes Zed
# skip update polling and turns "Check for Updates" into this message (crates/auto_update).
ZED_UPDATE_EXPLANATION="Zed is installed by the OS image. Update it with bootc upgrade."
