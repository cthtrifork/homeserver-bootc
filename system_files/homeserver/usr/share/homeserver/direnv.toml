# Seeded into ~/.config/direnv/direnv.toml by tmpfiles (never overwritten once present).
# https://direnv.net/man/direnv.toml.1.html
[global]
load_dotenv = true
strict_env = true
bash_path = "/usr/bin/bash"
hide_env_diff = true

# https://direnv.net/man/direnv.toml.1.html#whitelist
[whitelist]
# Absolute paths: direnv sees the resolved /var/home/... path (/home is a symlink on
# bootc), so "~" (which expands to /home/...) would never match.
prefix = ["/var/home/caspertdk/projects", "/home/caspertdk/projects"]
