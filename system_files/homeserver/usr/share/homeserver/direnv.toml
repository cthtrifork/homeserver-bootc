# Seeded into ~/.config/direnv/direnv.toml by tmpfiles (never overwritten once present).
# https://direnv.net/man/direnv.toml.1.html
[global]
load_dotenv = true
strict_env = true
bash_path = "/usr/bin/bash"
hide_env_diff = true

# https://direnv.net/man/direnv.toml.1.html#whitelist
[whitelist]
prefix = ["~/projects"]
