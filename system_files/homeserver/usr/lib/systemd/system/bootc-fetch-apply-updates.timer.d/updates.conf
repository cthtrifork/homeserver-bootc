[Timer]
# Clear the original triggers
OnBootSec=
OnUnitInactiveSec=
RandomizedDelaySec=

# Images are built on pushes to main and every Sunday 03:00, so polling every 10 minutes found nothing
# almost every time. Check once a night instead, in the quiet hours. Persistent=true runs a missed check
# soon after boot, so a machine that was off at night still catches up.
OnCalendar=*-*-* 04:00:00
RandomizedDelaySec=30m
Persistent=true
