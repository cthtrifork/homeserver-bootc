# Stage the new image on every check, but only reboot into it when it does no harm
# (see /usr/libexec/homeserver/apply-staged-update). The stock unit reboots straight away.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Nice=19
IOSchedulingClass=idle
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
# The '-' ignores failures, so a deferred reboot does not mark the unit failed.
ExecStartPost=-/usr/libexec/homeserver/apply-staged-update
