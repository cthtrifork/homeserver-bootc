# sudo SYSTEMD_LOG_LEVEL=debug systemd-tmpfiles --create system_files/homeserver/etc/tmpfiles.d/caspertdk-docker-login.conf --dry-run --no-pager
d /var/home/caspertdk                                       0750 1010 1010 - -
Z /var/home/caspertdk                                       -    -    -    - -
d /var/home/caspertdk/.docker                               0700 1010 1010 - -
Z /var/home/caspertdk/.docker                               -    -    -    - -
d /var/home/caspertdk/.config                               0700 1010 1010 - -
Z /var/home/caspertdk/.config                               -    -    -    - -
d /var/home/caspertdk/.config/containers                    0700 1010 1010 - -
Z /var/home/caspertdk/.config/containers                    -    -    -    - -
# Copy
C /var/home/caspertdk/.config/containers/auth.json          0600 1010 1010 - /usr/lib/container-auth.json
Z /var/home/caspertdk/.config/containers/auth.json          - - - -
# Point Docker's legacy path at the same file
L /var/home/caspertdk/.docker/config.json                   - - - - ../.config/containers/auth.json
