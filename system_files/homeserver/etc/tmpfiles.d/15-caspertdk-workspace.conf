# The workspace disk is mounted on this directory (etc/fstab). Its root, a blank xfs at the first boot, belongs to the admin user. The mount creates the parent
# /var/home/caspertdk first as root on the home disk: 11-caspertdk-ssh.conf hands it to UID 1010 (d adjusts an existing directory).
d /var/home/caspertdk/workspace 0755 1010 1010 - -
